name: Deploy EZP Program

on:
  push:
    branches: [ezp-program-web]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ezp-program-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout web-only branch
        uses: actions/checkout@v4

      - name: Fetch native backend sources from master
        run: |
          git fetch --no-tags --depth=1 https://github.com/UniTool-Android/scriba.git master
          git checkout FETCH_HEAD -- src
          test -f src/flashcmd_api.c

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git web/emsdk
          cd web/emsdk
          ./emsdk install 6.0.6
          ./emsdk activate 6.0.6

      - name: Build EZP Program Web
        shell: bash
        run: |
          set -euo pipefail
          source web/emsdk/emsdk_env.sh
          make -C web
          test -s web/dist/index.html
          test -s web/dist/wasm/ezp-program.js
          test -s web/dist/wasm/ezp-program.wasm

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
